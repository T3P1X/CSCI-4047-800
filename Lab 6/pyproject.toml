[project]
name = "art-api"
version = "0.1.0"
description = "A REST API for famous works of art."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
dev = "app.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# pytest reads this section even if you installed with pip.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# FastAPI's Depends(...) and Query(...) are meant to be used as default
# arguments, so tell Ruff's B008 rule they're safe.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
