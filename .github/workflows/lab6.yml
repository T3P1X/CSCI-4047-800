name: Lab 6
on:
  push:
    paths: ['Lab 6/**', '.github/workflows/lab6.yml']
  pull_request:
    paths: ['Lab 6/**', '.github/workflows/lab6.yml']
  workflow_dispatch:
jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check .
        working-directory: Lab 6
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: pytest -v
